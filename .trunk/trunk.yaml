# Trunk: https://docs.trunk.io/cli
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    # register B20: a colour or font outside tokens.css blocks the push
    - stylelint@18.1.0:
        packages:
          - stylelint-declaration-strict-value@1.13.0
actions:
  definitions:
    - id: block-push-on-findings
      triggers: [{git_hooks: [pre-push]}]
      run: trunk check --ci --no-fix --upstream origin/main
    # Opengrep security scan (house skill gate-commits-with-trunk, mkb-winops spec 060
    # installs the binary and the pinned js/ts security rules). Only files changed
    # since origin/main, only new findings; blocks on ERROR and WARNING. Override one
    # finding with `// nosemgrep: <rule-id>` (the short id it prints) on or above the line.
    - id: block-push-on-opengrep
      triggers: [{git_hooks: [pre-push]}]
      environment:
        - name: MISE_GLOBAL_CONFIG_FILE
          value: ${env.MISE_GLOBAL_CONFIG_FILE}
        - name: PATHEXT
          value: ${env.PATHEXT}
      run: >-
        sh -c 't=$(command -v timeout) && t="$t 60"; o="scan --experimental --disable-version-check --error --severity ERROR --severity WARNING --baseline-commit origin/main --config C:/ProgramData/opengrep/semgrep-rules ."; for n in 1 2; do $t opengrep $o; rc=$?; case $rc in 0|1) exit $rc;; 2|124) ;; *) echo "opengrep setup error (exit $rc): push blocked" >&2; exit $rc;; esac; echo "opengrep crashed (exit $rc, not a finding), try $n of 2" >&2; done; echo "opengrep crashed twice (exit $rc): push not blocked, run it by hand" >&2'
    # Maintainability gate (register B13): copy-paste check; repo has no package.json.
    - id: maintainability-on-push
      run: npx -y jscpd@5.4.3 . --silent
      triggers: [{git_hooks: [pre-push]}]
    # Coverage register T24: every SPEC promise is a traced OpenFastTrace item (mkb-agentops spec 145).
    - id: trace-on-push
      triggers: [{git_hooks: [pre-push]}]
      run: node A:/personal-markkennethbadilla/mkb-agentops/scripts/trace.mjs specs/requirements.md && bash scripts/repo-checks.sh
    # Secrets (spec 021): the local core.hooksPath hides the global gitleaks pre-commit.
    - id: block-commit-on-secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner
      triggers: [{git_hooks: [pre-commit]}]
  enabled: [block-push-on-findings, block-push-on-opengrep, maintainability-on-push, trace-on-push, block-commit-on-secrets]
